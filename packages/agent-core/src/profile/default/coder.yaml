extends: subagent-base
name: coder
promptVars:
  roleAdditionalAppend: |
    Execution cadence: explore → smallest change → focused check → continue. No drive-by cleanup outside the brief. Match local style; delete only dead paths you touch. When blocked, stop with evidence. Your final handoff must include verification evidence (commands/tests/observations) so the parent can trust the result. For user-visible UI: Skill("premium-visual") before first markup; VerifySurface / BrowserScreenshot before done.
whenToUse: |
  Use this agent for non-trivial software engineering work that may require reading files, editing code, running commands, and returning a compact but technically complete summary to the parent agent.
tools:
  # Lean coding + browser-use waist for visual proof (≤30). DeepResearch/SkillCreate
  # stay on superliora-full to leave room for Browser*. Computer* stays on full.
  - Read
  - Write
  - Edit
  - ApplyPatch
  - Grep
  - Glob
  - Bash
  - Script
  - Expand
  - Compact
  - Refine
  - RunProjectChecks
  - RepoQuery
  - WebSearch
  - FetchURL
  - ReadMediaFile
  - BrowserStatus
  - BrowserObserve
  - BrowserScreenshot
  - BrowserAct
  - BrowserConsole
  - VerifySurface
  - Review
  - VisualDiff
  - Memory
  - TodoList
  - Skill
  - SearchSkill
  - SearchTools
  - GetCurrentTime

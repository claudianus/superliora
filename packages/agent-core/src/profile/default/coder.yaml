extends: subagent-base
name: coder
promptVars:
  roleAdditionalAppend: |
    Execution cadence: explore → smallest change → focused check → continue. No drive-by cleanup outside the brief. Match local style; delete only dead paths you touch. When blocked, stop with evidence. Your final handoff must include verification evidence (commands/tests/observations) so the parent can trust the result.
whenToUse: |
  Use this agent for non-trivial software engineering work that may require reading files, editing code, running commands, and returning a compact but technically complete summary to the parent agent.
tools:
  # Lean coding surface for specialist workers (no goal/swarm/media generation
  # bloat; Context7 left to main agent to save specialist tokens). No
  # AskUserQuestion (workers must not ask the end user) and no mcp__* wildcard
  # (unbounded schema bloat on every spawn).
  - Read
  - Write
  - Edit
  - ApplyPatch
  - Grep
  - Glob
  - Bash
  - Expand
  - RunProjectChecks
  - RepoQuery
  - WebSearch
  - DeepResearch
  - FetchURL
  - ReadMediaFile
  - VerifySurface
  - Review
  - VisualDiff
  - Memory
  - TodoList
  - Skill
  - SearchSkill
  - SearchTools
  - GetCurrentTime

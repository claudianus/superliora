name: agent
description: Default SuperLiora agent

systemPromptPath: ./system.md
promptVars:
  # Gates Coding / Execution Loop / Practical Engineering in system.md (Conductor omits).
  INCLUDE_WORKER_LOOP: '1'
  roleAdditional: ''

tools:
  # Session-coding waist (Loop5 + Loop19c): ApplyPatch + RepoQuery + WebSearch/FetchURL.
  # DeepResearch / expert / TaskGraph stay on superliora-full (or explore/plan).
  # Media + Context7 live on Conductor worker profiles (coder/goal-driver/explore/plan).
  # Opt-in full surface: SUPERLIORA_PROFILE=superliora-full.
  - Read
  - Write
  - Edit
  - ApplyPatch
  - Grep
  - Glob
  - Bash
  - Script
  - Compact
  - RunProjectChecks
  - RepoQuery
  # Progress transparency and long-run autonomy (main agent only).
  - TodoList
  - EnterPlanMode
  - NextPhase
  - ExitPlanMode
  - RecordInterviewFinding
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  # Skills + subagents + continual-harness (main lane).
  - Skill
  - SearchSkill
  - SkillCreate
  - Refine
  - SearchTools
  - Agent
  - Fleet
  # External information and user clarification (light research path).
  - WebSearch
  - FetchURL
  - AskUserQuestion
  - TaskList
  - TaskOutput
  - TaskStop
  # Connected MCP / plugin servers (access pattern).
  - mcp__*
  # Edges on superliora-full / explore / coder: DeepResearch, Expand, Memory,
  # GetCurrentTime, Context7*, ReadMediaFile, SearchExpert, TaskGraph.
  # Default agent waist: Script/Compact/Refine for Prime-parity harness (+ mcp__*).

subagents:
  coder:
    description: Good at general software engineering tasks.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
  plan:
    description: Read-only implementation planning and architecture design.

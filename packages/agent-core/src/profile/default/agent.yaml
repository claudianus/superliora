name: agent
description: Default SuperLiora agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: ''

tools:
  # Session-coding waist (Phase A/E): keep ApplyPatch + RepoQuery + DeepResearch;
  # push Context7/media/expert/TaskGraph edges to superliora-full (discoverable via
  # SearchTools active_only=false on full, or SUPERLIORA_PROFILE=superliora-full).
  - Read
  - Write
  - Edit
  - ApplyPatch
  - Grep
  - Glob
  - Bash
  - RunProjectChecks
  - RepoQuery
  # Progress transparency and long-run autonomy (main agent only).
  - TodoList
  - EnterPlanMode
  - NextPhase
  - ExitPlanMode
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  # Skills + subagents (catalog still loads on demand).
  - Skill
  - SearchSkill
  - SearchTools
  - Agent
  - Fleet
  # External information and user clarification.
  - WebSearch
  # never-empty; Ch3 실패 시 Ch4/Ch5 escalate.
  - DeepResearch
  - FetchURL
  - AskUserQuestion
  - TaskList
  - TaskOutput
  - TaskStop
  - Review
  # Edges on superliora-full: Expand, Memory, GetCurrentTime, Context7*,
  # ReadMediaFile, SearchExpert, TaskGraph, visual/MCP. Default waist ≤30.

subagents:
  coder:
    description: Good at general software engineering tasks.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
  plan:
    description: Read-only implementation planning and architecture design.

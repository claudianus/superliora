name: agent
description: Default SuperLiora agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: ''

tools:
  # Core waist + session orchestration (bisect-safe: keep ApplyPatch, RepoQuery, DeepResearch).
  - Read
  - Write
  - Edit
  - ApplyPatch
  - Grep
  - Glob
  - Bash
  - Expand
  - RunProjectChecks
  - RepoQuery
  # Progress transparency and long-run autonomy (main agent only).
  - TodoList
  - TaskGraph
  - EnterPlanMode
  - NextPhase
  - ExitPlanMode
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - GetCurrentTime
  # Skills + subagents (catalog still loads on demand).
  - Skill
  - SearchSkill
  - SearchTools
  - Agent
  - SearchExpert
  - AgentSwarm
  # External information and user clarification.
  - WebSearch
  # never-empty; Ch3 실패 시 Ch4/Ch5 escalate.
  - DeepResearch
  - FetchURL
  - Context7Resolve
  - Context7Docs
  - AskUserQuestion
  - Memory
  - TaskList
  - TaskOutput
  - TaskStop
  - ReadMediaFile
  - GenerateImage
  - GenerateVideo
  - VerifySurface
  - Review
  - VisualDiff
  # MCP tools are gated separately by the profile.
  - mcp__*

subagents:
  coder:
    description: Good at general software engineering tasks.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
  plan:
    description: Read-only implementation planning and architecture design.

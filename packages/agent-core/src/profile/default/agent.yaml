name: agent
description: Default SuperLiora agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: ''

tools:
  # Session-coding waist (Loop5 + Loop19c): ApplyPatch + RepoQuery + WebSearch/FetchURL.
  # DeepResearch / Context7 / media / expert / TaskGraph stay on superliora-full
  # (or specialist profiles). Opt-in: SUPERLIORA_PROFILE=superliora-full.
  - Read
  - Write
  - Edit
  - ApplyPatch
  - Grep
  - Glob
  - Bash
  - RunProjectChecks
  - RepoQuery
  # Progress transparency and long-run autonomy (main agent only).
  - TodoList
  - EnterPlanMode
  - NextPhase
  - ExitPlanMode
  - RecordInterviewFinding
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  # Skills + subagents (catalog still loads on demand).
  - Skill
  - SearchSkill
  - SearchTools
  - Agent
  - Fleet
  # External information and user clarification (light research path).
  - WebSearch
  - FetchURL
  - AskUserQuestion
  - TaskList
  - TaskOutput
  - TaskStop
  # Edges on superliora-full / explore / coder: DeepResearch, Expand, Memory,
  # GetCurrentTime, Context7*, ReadMediaFile, SearchExpert, TaskGraph, visual/MCP.
  # Default agent waist target: ≤29 (headroom under hard 30 cap).

subagents:
  coder:
    description: Good at general software engineering tasks.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
  plan:
    description: Read-only implementation planning and architecture design.

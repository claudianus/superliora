extends: subagent-base
name: plan
promptVars:
  roleAdditionalAppend: |
    Implementation planning specialist. Product tree is read-only; under plan mode you may Write/Edit only the current plan file. Produce a step-by-step plan, identify key files, and analyze architectural trade-offs. Do not execute the plan yourself; return it to the parent agent. Use AskUserQuestion when the host routes interview/preference questions to the user.
whenToUse: |
  Use this agent when the parent agent needs a step-by-step implementation plan, key file identification, and architectural trade-off analysis before code changes are made.
tools:
  # Plan Desk / mission waist: explore + Script PTC + write plan files/lifecycle + library docs.
  # No Browser*/media-gen/RunProjectChecks — implement Jobs own execution proof.
  - Read
  - Write
  - Edit
  - ApplyPatch
  - Grep
  - Glob
  - Bash
  - Script
  - RepoQuery
  - WebSearch
  - DeepResearch
  - FetchURL
  - Context7Resolve
  - Context7Docs
  - ReadMediaFile
  - Review
  - TodoList
  - Skill
  - SearchSkill
  - SearchTools
  - GetCurrentTime
  - EnterPlanMode
  - ExitPlanMode
  - NextPhase
  - RecordInterviewFinding
  - AskUserQuestion
  - mcp__*

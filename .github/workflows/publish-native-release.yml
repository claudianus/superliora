name: Publish Native Release

# Build all SEA targets, produce manifest.json, upload to a GitHub Release.
# Trigger with workflow_dispatch (tag input) or by pushing a v* tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (creates or updates the GitHub Release)'
        required: true
        type: string
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: liora-native
      retention-days: 7
      # Default unsigned so publish works without Apple notarization secrets.
      # Flip to true (and provide APPLE_* secrets) when shipping notarized macOS SEA.
      sign-macos: false

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Check out the release tag, not the dispatch-time default branch:
          # the auto-release train dispatches this workflow seconds after
          # pushing the version commit, and a default-branch checkout can
          # race behind it and see the previous version.
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Resolve release tag
        id: rel
        shell: bash
        env:
          # Indirect via env, never interpolated into the shell text — a tag or
          # input containing quotes/semicolons must not become bash source.
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_EVENT" = 'workflow_dispatch' ] && [ "$RELEASE_PRERELEASE" = 'true' ]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Assert release tag matches package + CDN tip files
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          # Accept v0.5.0 or @superliora/liora@0.5.0
          ver="${tag##*@}"
          ver="${ver#v}"
          pkg="$(node -p "require('./apps/liora/package.json').version")"
          latest="$(tr -d '[:space:]' < latest)"
          json="$(node -p "JSON.parse(require('fs').readFileSync('latest.json','utf8')).version")"
          if [ "$ver" != "$pkg" ] || [ "$ver" != "$latest" ] || [ "$ver" != "$json" ]; then
            echo "Release tag version ($ver) must match apps/liora ($pkg), latest ($latest), latest.json ($json)"
            exit 1
          fi
          node scripts/check-cdn-latest.mjs

      - name: Download all native artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: native-artifacts
          pattern: liora-native-*
          merge-multiple: true

      - name: Collect zips and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Artifacts may land nested; flatten liora-*.zip(+.sha256) into release-assets/
          find native-artifacts -type f \( -name 'liora-*.zip' -o -name 'liora-*.zip.sha256' \) \
            -exec cp -f {} release-assets/ \;
          ls -la release-assets
          test -n "$(find release-assets -maxdepth 1 -name 'liora-*.zip.sha256' | head -n1)"

      - name: Produce manifest.json
        shell: bash
        run: |
          node apps/liora/scripts/native/produce-manifest.mjs release-assets '${{ steps.rel.outputs.tag }}'
          cat release-assets/manifest.json

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: SuperLiora ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

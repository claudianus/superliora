name: Publish Native Release

# Build all SEA targets, produce manifest.json, upload to a GitHub Release.
# Trigger manually with a tag (e.g. v0.x.y or @superliora/liora@0.x.y).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (creates or updates the GitHub Release)'
        required: true
        type: string
      prerelease:
        description: 'Mark release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: liora-native
      retention-days: 7
      sign-macos: true
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download all native artifacts
        uses: actions/download-artifact@v7
        with:
          path: native-artifacts
          pattern: liora-native-*
          merge-multiple: true

      - name: Collect zips and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Artifacts may land nested; flatten liora-*.zip(+.sha256) into release-assets/
          find native-artifacts -type f \( -name 'liora-*.zip' -o -name 'liora-*.zip.sha256' \) \
            -exec cp -f {} release-assets/ \;
          ls -la release-assets
          test -n "$(find release-assets -maxdepth 1 -name 'liora-*.zip.sha256' | head -n1)"

      - name: Produce manifest.json
        shell: bash
        run: |
          node apps/liora/scripts/native/produce-manifest.mjs release-assets '${{ inputs.tag }}'
          cp release-assets/manifest.json release-assets/manifest.json
          cat release-assets/manifest.json

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: SuperLiora ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

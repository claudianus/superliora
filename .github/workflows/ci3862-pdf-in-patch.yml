name: ci3862-pdf-in-patch
on:
  push:
    branches: [fix/ci-3862-unused-exports-pdf-in]
    paths: [".github/workflows/ci3862-pdf-in-patch.yml", ".ci3862-restore/patch_pdf_in.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-3862-unused-exports-pdf-in
      - name: Apply pdf_in patches
        run: python3 .ci3862-restore/patch_pdf_in.py
      - name: Commit and cleanup
        run: |
          set -euo pipefail
          rm -rf .ci3862-restore
          rm -f .github/workflows/ci3862-pdf-in-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(test): add ModelCapability.pdf_in to agent-core tests"
          git push

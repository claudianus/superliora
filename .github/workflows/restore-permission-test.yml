name: restore-permission-test
on:
  workflow_dispatch:
  push:
    branches: [fix/ci-3966-after-1213]
    paths:
      - packages/agent-core/test/agent/permission/.restore-zlib/**
      - .github/workflows/restore-permission-test.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-3966-after-1213
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble permission.test.ts
        run: python3 packages/agent-core/test/agent/permission/.restore-zlib/assemble.py
      - name: Cleanup staging artifacts and orphan shards
        run: |
          rm -rf packages/agent-core/test/agent/permission/.restore-zlib
          rm -rf packages/agent-core/test/agent/permission/.restore-b64
          rm -f packages/agent-core/test/agent/permission/permission-permission-auto-mode-p0-s1.test.ts
      - name: Commit restored suite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packages/agent-core/test/agent/permission.test.ts
          git add -u packages/agent-core/test/agent/permission/ || true
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "fix(ci): restore full permission.test.ts suite with H4 opt-in"
          git push

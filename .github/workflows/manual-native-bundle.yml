name: Manual Native Bundle

# Builds SEA artifacts only (Actions artifacts, 3-day retention).
# To publish zip + manifest.json to a GitHub Release for install.sh/ps1,
# use the "Publish Native Release" workflow instead.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_native-build.yml
    with:
      upload-artifact-prefix: liora-native
      retention-days: 3
      # Unsigned local SEA profile — Apple secrets are not required for CI smoke.
      # Use Publish Native Release with sign-macos when notarized macOS builds are needed.
      sign-macos: false
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}

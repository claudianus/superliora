name: ci3862-restore-files
on:
  push:
    branches: [fix/ci-3862-unused-exports-pdf-in]
    paths: [".ci3862-restore/**", ".github/workflows/ci3862-restore.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-3862-unused-exports-pdf-in
      - name: Assemble staged files
        run: python3 .ci3862-restore/assemble.py
      - name: Commit restored files and remove staging
        run: |
          set -euo pipefail
          rm -rf .ci3862-restore
          rm -f .github/workflows/ci3862-restore.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(test): restore agent-core tests with ModelCapability.pdf_in"
          git push

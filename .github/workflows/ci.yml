name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - 'v*'
  # Nightly full-matrix pass: per-push Windows CI runs a Windows-critical
  # subset only, so the full Windows suite runs here as the safety net.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:source-install

  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # --retry=1 absorbs one-off timing flakes (e.g. premium-motion frame
      # sampling) without masking real regressions: they fail twice and the
      # job stays red. The test-baseline ratchet (meta/test-baseline.yaml) is
      # a manual tool ??with zero pinned failures it is vacuous in CI.
      - run: node scripts/test-local.mjs --all --shard=${{ matrix.shard }}/2 --retry=1

  # Windows is a first-class platform, but the full suite on windows-latest
  # costs ~27 min and Linux already covers it on every push. Per-push Windows
  # CI runs the Windows-critical surfaces (TUI/CLI, renderer, FS/process
  # abstractions, ACP, in-process e2e); the FULL Windows suite gates the
  # nightly schedule, release tags, and manual dispatch below.
  test-windows:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-local.mjs apps/liora/test packages/tui-renderer/test packages/kaos/test packages/acp-adapter/test packages/server-e2e/test --shard=${{ matrix.shard }}/2 --testTimeout=30000 --maxWorkers=2 --retry=1

  test-windows-full:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      # Default forks use cpus-1 workers; that OOMs windows-latest and
      # fails the job with "Worker exited unexpectedly" after every
      # reported test passed. Cap the pool (also set in vitest.config.ts).
      - run: node scripts/test-local.mjs --all --testTimeout=30000 --maxWorkers=2 --retry=1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check:imports
      - run: pnpm run check:retire-guardrails
      - run: pnpm run check:layering -- --fail
      - run: pnpm run check:loc -- --fail
      - run: pnpm run check:dir -- --fail
      - run: pnpm run check:unused-exports -- --fail
      - run: pnpm run check:changeset
      - run: pnpm run check:await-scan
      - run: pnpm run check:slop
      - run: pnpm run check:nix-workspace
      - run: pnpm run sherif
      - run: pnpm run check:branding:strict
      - run: pnpm run check:cdn-latest
      - name: Theme contrast check (WCAG AA)
        run: pnpm --filter @superliora/liora run check:contrast

  soft-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:settings-inventory
      - run: pnpm run check:mission-fleet-path
      - name: Cache warm KPI (50-turn mock)
        run: pnpm -C packages/agent-core run cache:warm-kpi
      - name: Search never-empty KPI (free-only mock)
        run: pnpm -C packages/agent-core run search:never-empty-kpi
      - name: DeepResearch never-empty KPI (empty-cascade mock)
        run: pnpm -C packages/agent-core run deep-research:never-empty-kpi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        env:
          TSGO_PKG: '@typescript/native-preview@7.0.0-dev.20260707.2'
        run: |
          pnpm dlx --package "${TSGO_PKG}" tsgo --version
          for config in packages/*/tsconfig.json apps/liora/tsconfig.json; do
            if [ "${config}" = "packages/agent-core/tsconfig.json" ]; then
              continue
            fi
            echo "Typechecking ${config}"
            pnpm dlx --package "${TSGO_PKG}" tsgo -p "${config}" --noEmit
          done
          echo "Typechecking packages/agent-core/tsconfig.src.json"
          pnpm dlx --package "${TSGO_PKG}" tsgo -p packages/agent-core/tsconfig.src.json --noEmit
      - name: Agent-core test typecheck ratchet
        run: pnpm run check:agent-core-test-types

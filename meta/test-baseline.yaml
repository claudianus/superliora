# Test baseline ratchet — expected failures. Update only via:
#   node scripts/check-test-baseline.mjs --update
version: 1
packages:
  - dir: apps/liora
    runner: vitest
    failures:
      - "/permission command keeps showPermissionPicker available for settings hub"
      - "/permission command opens the picker when args are empty"
      - "AgentDashboardComponent accessibility announces selection position as plain text and documents Home/End in hints"
      - "AgentDashboardComponent accessibility supports Home/End jump for keyboard-only navigation"
      - "AssistantMessageComponent shows a pulsing caret at the end of the content while streaming"
      - "FileMentionProvider does not tag the primary help suggestion as advanced"
      - "FileViewerComponent labels unknown extensions as plain text in the header"
      - "FooterComponent — context NaN resilience shows \"thinking\" label when thinking is enabled, hides it when disabled"
      - "LioraTUI startup applies --auto after picking a session from bare --session"
      - "LioraTUI startup clears startup picker exit confirmation before resuming a selected session"
      - "LioraTUI startup clears the sessions picker search query when toggling scope with Ctrl+A"
      - "LioraTUI startup copies a shell-safe resume command for another cwd with metacharacters"
      - "LioraTUI startup does not apply startup flags when switching sessions via the /sessions picker"
      - "LioraTUI startup does not remount the session picker after it is closed while a scope toggle is pending"
      - "LioraTUI startup does not resume a session from a different cwd and shows a cd hint"
      - "LioraTUI startup exits after picking another cwd from the startup picker"
      - "LioraTUI startup syncs configured thinking after OAuth login refreshes an active session"
      - "LioraTUI startup toggles the sessions picker from all sessions back to current cwd with Ctrl+A"
      - "LioraTUI startup toggles the sessions picker from current cwd to all sessions with Ctrl+A"
      - "PromptIntelligenceController sets promptIntelligencePhase while inline request runs"
      - "PromptIntelligenceController shows pending ghost then paints short completions"
      - "TUI handleInput — printable-key guard forbids bare-literal printable comparisons on `data` (use printableChar)"
      - "UpgradeDialogComponent dismisses up-to-date with Enter or Esc"
      - "UpgradeDialogComponent offers Install and Later when an update can auto-install"
      - "UpgradeDialogComponent shows a manual command when auto-install is unavailable"
      - "UpgradeDialogComponent shows already-installing status"
      - "UpgradeDialogComponent shows error details for diverged and check-failed"
      - "UpgradeDialogComponent shows the manual command for diverged checkouts"
      - "UpgradeDialogComponent warns when a dirty github checkout blocks install"
      - "copyTextToClipboard throws an Error when all platform clipboard commands fail"
      - "experimental feature command handlers persists config overrides, refreshes command flags, closes the panel, and reloads"
      - "resolveSlashCommandInput blocks idle-only built-ins while streaming"
      - "resolveSlashCommandInput blocks model and session pickers while compacting"
      - "update preference commands saves automatic update preference changes to tui.toml"
      - "updateActivityPane terminal progress moves the moon spinner into the AgentSwarm progress row while active"
    unstable: []

<!doctype html>
<html lang="ko" data-doc="jobs">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        var KEY = 'superliora-theme';
        var theme = 'dark';
        try {
          var stored = localStorage.getItem(KEY);
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.setAttribute('name', 'theme-color');
          document.head.appendChild(meta);
        }
        meta.setAttribute('content', theme === 'light' ? '#f0f4f8' : '#0D1422');
      })();
    </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jobs · SuperLiora</title>
    <meta name="description" content="SuperLiora Conductor docs" />
    <link rel="canonical" href="https://claudianus.github.io/superliora/docs/jobs.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <meta name="theme-color" content="#0D1422" />
    <link rel="icon" type="image/svg+xml" href="/superliora/favicon.svg" />
  </head>
  <body class="bg-bg text-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/docs-main.tsx"></script>
  </body>
</html>
